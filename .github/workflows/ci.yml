name: CI

# No path filter: the docs promise the coverage gate runs on every PR, and the
# job is cheap — a filter would silently skip frontend/loadtest/docs-only PRs
# (and deadlock a required check in branch protection).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and coverage gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Enforce coverage >= 80%
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total backend coverage (internal/): $total%"
          awk -v t="$total" 'BEGIN { if (t == "" || t + 0 < 80) { print "::error::backend coverage " t "% is below the 80% threshold"; exit 1 } }'
