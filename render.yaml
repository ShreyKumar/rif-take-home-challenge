# Render Blueprint — a free, public live demo of the mutant-detector service.
# https://render.com/docs/blueprint-spec
#
# This is a convenience on top of the graded work; it does not change the local
# default configuration (NFR-6 — `go run ./cmd/server` still needs no external
# services). Deploy by pointing Render's "New → Blueprint" at this repo.
#
# Deployed via the multi-stage backend/Dockerfile rather than Render's native Go
# runtime: the image COPYs frontend/ to /app/frontend and bakes in
# FRONTEND_DIR=/app/frontend (absolute), so serving the static UI does not depend
# on Render's runtime working directory or checkout path — the fragile part that
# breaks the native-runtime approach. The build context is the repo root so the
# Dockerfile can see both backend/ and frontend/.
services:
  - type: web
    name: mutant-detector
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # PORT is injected by Render and read by the server; FRONTEND_DIR and DB_PATH
    # are baked into the image (DB is ephemeral on the free tier — no disk).
