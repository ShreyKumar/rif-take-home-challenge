# Render Blueprint — a free, public live demo of the mutant-detector service.
# https://render.com/docs/blueprint-spec
#
# This is a convenience on top of the graded work; it does not change the local
# default configuration (NFR-6 — `go run ./cmd/server` still needs no external
# services). Deploy by pointing Render's "New → Blueprint" at this repo.
#
# The build runs from the repo root so both backend/ and frontend/ are visible:
# it compiles the server from backend/, and the running process serves the
# static frontend from FRONTEND_DIR=frontend (repo-root-relative), differing
# from the local default of ../frontend.
services:
  - type: web
    name: mutant-detector
    runtime: go
    plan: free
    branch: main
    buildCommand: cd backend && go build -o ../server ./cmd/server
    startCommand: ./server
    healthCheckPath: /healthz
    envVars:
      # Render injects PORT at runtime; the server reads it (config default 8080).
      - key: FRONTEND_DIR
        value: frontend
      # Free tier has no persistent disk, so the DB is intentionally ephemeral
      # (see the deploy note in the README) — /tmp is guaranteed writable.
      - key: DB_PATH
        value: /tmp/mutant.db
